[workspace]
resolver = "2"
members = ["crates/np-core", "crates/np-cli"]

[workspace.package]
version = "0.3.0"
edition = "2021"
# **MIT, ruled by the operator on 2026-12-08** (**F47**), and `LICENSE` at the root is the authority — this field is metadata that must agree
# with it, which is why it lives in `[workspace.package]` where a member cannot drift from it. The reason MIT specifically: it matches the code
# we statically link (llama.cpp/ggml, MIT), so no obligation here is stricter than one already being satisfied, and it keeps a downstream user's
# obligations to "keep the notices attached". `license = "MIT"` alone (no `OR Apache-2.0`) is deliberate: nothing in this workspace is dual-licensed
# by its authors, and an option nobody granted is worse than no option.
license = "MIT"

# Every dependency is declared once here; member crates opt in with
# `workspace = true` when they actually use it.
[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
toml = "0.9"
# Pinned exactly, unlike the caret ranges above. `np-core::catalog` breaks a wrapped line on
# display width (F12), so the classification of one character decides published bytes: a Unicode
# revision that reclassified an ideograph or emoji would silently move a break point in a future
# build. The pin makes that an explicit dependency change, and `tests/catalog.rs` fails a test if
# the widths this code depends on ever move.
unicode-width = "=0.2.2"
walkdir = "2.5"
