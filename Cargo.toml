[workspace]
resolver = "2"
members = ["crates/np-core", "crates/np-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"

# Every dependency is declared once here; member crates opt in with
# `workspace = true` when they actually use it.
[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
toml = "0.9"
walkdir = "2.5"
