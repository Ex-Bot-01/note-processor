[workspace]
resolver = "2"
members = ["crates/np-core", "crates/np-cli"]

[workspace.package]
version = "0.8.0"
edition = "2021"
# **MIT** — `docs/adr/0010-the-crate-is-mit.md` records who ruled it and why; `LICENSE` at the root is the authority. It sits
# in `[workspace.package]` so a member crate cannot drift from it while still publishing metadata.
license = "MIT"

# Every dependency is declared once here; member crates opt in with
# `workspace = true` when they actually use it.
[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
toml = "0.9"
# The diagnostic channel's vocabulary (`docs/reference-diagnostics.md`). np-core carries `tracing` **without a subscriber**:
# an instrumented library that installs nothing costs a compare-and-return per event — the "free when off" half — and a
# caller embedding np-core keeps its own subscriber. `tracing-subscriber` belongs to np-cli alone, because the global sink is
# the process's and only `np` owns a process. `std` only, and no `attributes` feature: these crates use `event!`/`span!` and
# the `Subscriber`/`Layer` traits, never `#[instrument]`, so that feature would add a proc macro and a second copy of `syn`
# to every build for something nothing calls.
tracing = { version = "0.1", default-features = false, features = ["std"] }
# The subscriber np-cli owns. `default-features = false` keeps out what this program does not use: no `fmt` layer (the human
# format is six lines of `format!`, and pinned bytes on stderr predate tracing), no `env-filter` (`NP_LOG` precedence is the
# *inverse* of the ecosystem's env-beats-file habit — see `np_core::config::DIAG_ENV_VAR`), no ansi. `registry` is the part
# that matters: it gives spans somewhere to live, which is what request correlation and span durations read from.
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
# Pinned exactly, unlike the caret ranges above: `np-core::catalog` breaks a wrapped line on display width, so one
# character's classification decides published bytes. A Unicode revision that reclassified an ideograph or emoji would move
# a break point silently in a future build; the pin makes it an explicit dependency change, and `tests/catalog.rs` fails if
# the widths this code depends on ever move.
unicode-width = "=0.2.2"
walkdir = "2.5"
