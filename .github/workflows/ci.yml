name: CI

on: [push, pull_request]

# Nothing here writes back to the repository, so the token stays read-only.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # One job, both platforms: the two OS entries are the two rows on the run page.
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain components
        run: rustup component add clippy rustfmt
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      # `cargo doc` has no `--deny` flag of its own, so the lint setting goes through rustdoc.
      # The whole workspace, because `np-cli` documents clean too — a warning in its docs would
      # otherwise reach main unnoticed.
      - name: Docs
        env:
          RUSTDOCFLAGS: --deny warnings
        run: cargo doc --locked --workspace --no-deps
      # `CMAKE` points at nothing on purpose. Both runners have cmake preinstalled, so "the default build never
      # touches the C++" would otherwise be unprovable here: a regression that probed cmake with the feature off
      # would stay green and just get slower. With this set, build.rs meeting cmake at all is impossible - it
      # returns before reading the variable (R6b0 review P2-10), and if that ever stops being true this row fails.
      - name: Test
        env:
          CMAKE: /nonexistent
        run: cargo test --locked --workspace
      # The release-only cases (`#[ignore]`d huge-input tests) run here, so a linear-time
      # regression in `items` or `links` cannot land unmeasured.
      - name: Release tests
        run: cargo test --locked --release -- --ignored

  # The `local-model` row that design-m2-local-embeddings.md §2 promised, now that there is something
  # behind the feature to rot. A feature nothing compiles is invisible in exactly three ways - clippy
  # lints inside `cfg(feature)`, rustdoc warnings in gated docs, and tests whose early return looks like
  # a pass - and this job is what makes each of those fail loudly instead.
  #
  # Linux only, on purpose. §14 measured the C++ build here (23 s for target `llama`) and has seen
  # nothing on Windows or macOS, so adding those rows would put a claim in YAML that nobody has watched
  # happen - F18's mistake with a different noun. The Windows feature row lands when someone has seen it
  # green, and §2 keeps release binaries on the feature off until then.
  #
  # Honest caveat: GitHub Actions is currently down account-side (2026-10-29), so none of this has run
  # in CI yet. It was written and executed locally, gate for gate; treat the first green run as evidence
  # still owed, not as coverage already banked.
  feature-local-model:
    name: Feature local-model (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain components
        run: rustup component add clippy rustfmt
      # The one network step in this repository's build. Keyed on the pin file (where both digests live) *and*
      # on the script that produces the directory: an unpack layout change - strip-components, stamp location -
      # has to invalidate the cache too, or CI keeps restoring the old-shaped tree while the new script refuses
      # to re-unpack over it (R6b0 review P2-3). The script is idempotent and verifies content by header digest,
      # so a cache miss costs one 38.7 MB download rather than a stale-tree surprise.
      - name: Cache the pinned llama.cpp source
        uses: actions/cache@v4
        with:
          path: .vendor
          key: llama-cpp-${{ hashFiles('third_party/llama-cpp.toml', 'scripts/vendor-llama-cpp.sh') }}
      - name: Vendor llama.cpp
        run: ./scripts/vendor-llama-cpp.sh
      # cmake is preinstalled on ubuntu-latest; `build.rs` honours a `CMAKE` override for hosts where it
      # is not, and refuses with that name if it cannot find one at all.
      - name: Check
        run: cargo check --locked -p np-core --features local-model
      - name: Clippy
        run: cargo clippy --locked -p np-core --features local-model --all-targets -- -D warnings
      # The third way a feature is invisible, and the reason this step exists: `llama_ffi` is gated in
      # `src/lib.rs`, so the default job's Docs step never compiles the module and none of its intra-doc links
      # are resolved by any run. The job comment names rustdoc as one of the three gaps it closes, so it has
      # to run here (R6b0 review P1-4). Measured locally on 2026-10-29: this passes today, so it is coverage
      # being closed rather than a warning being unhidden.
      - name: Docs (feature on)
        env:
          RUSTDOCFLAGS: "--deny warnings"
        run: cargo doc --locked -p np-core --features local-model --no-deps
      # `--lib` alongside the link-proof test: the struct-layout pins in `src/llama_ffi.rs` only compile
      # with the feature on, and a wrong field order is an unsound memory bug rather than a compile
      # error. §2 step 4 wants skipped work printed as `NOT COVERAGE`; nothing here may skip - the link
      # proof has no artifact gate and no env-var escape, so a green run means llama.cpp was called.
      - name: Link proof
        run: cargo test --locked -p np-core --features local-model --lib --test local_runtime
      # "A green run means llama.cpp was called" is only worth saying if the run can also say *which* llama.cpp.
      # `-l static=llama` is not an exclusive search path, so two cheap probes back it up: no shared llama in the
      # test binary, and `llama_version` defined in it (i.e. it came from an archive we built, not from a
      # libllama that happened to be installed on the runner). Neither is sufficient alone - the pinned header
      # digest in build.rs is what actually identifies the tree - but together they turn "it linked" into
      # "it linked something we compiled" (R6b0 review P2-5).
      - name: Link identity probes
        run: |
          set -euo pipefail
          bin=$(cargo test --locked -p np-core --features local-model --test local_runtime --no-run --message-format=json \
            | sed -n 's/.*"executable":"\([^"]*local_runtime[^"]*\)".*/\1/p' | tail -n 1)
          test -n "$bin" && test -x "$bin"
          echo "inspecting $bin"
          if ldd "$bin" | grep -i llama; then
            echo "FAIL: a shared llama.cpp was picked up off the loader path" >&2
            exit 1
          fi
          echo "ok: no shared llama dependency"
          if ! nm --defined-only "$bin" | grep -q ' T llama_version'; then
            echo "FAIL: llama_version is not defined in the test binary; it did not come from our archive" >&2
            exit 1
          fi
          echo "ok: llama_version defined locally (statically linked from the pinned build)"
