name: CI

on: [push, pull_request]

# Nothing here writes back to the repository, so the token stays read-only.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # One job, both platforms: the two OS entries are the two rows on the run page.
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain components
        run: rustup component add clippy rustfmt
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      # `cargo doc` has no `--deny` flag of its own, so the lint setting goes through rustdoc.
      - name: Docs
        env:
          RUSTDOCFLAGS: --deny warnings
        run: cargo doc --locked -p np-core --no-deps
      - name: Test
        run: cargo test --locked --workspace
      # The release-only cases (`#[ignore]`d huge-input tests) run here, so a linear-time
      # regression in `items` or `links` cannot land unmeasured.
      - name: Release tests
        run: cargo test --locked --release -- --ignored
