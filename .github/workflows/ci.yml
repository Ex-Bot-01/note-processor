name: CI

# The matrix policy, in one sentence: a push to `main` grades Linux; Windows and both C++ feature rows run on the
# nightly schedule, on any pull request, and on `workflow_dispatch`, where `gh workflow run ci.yml --ref <sha>` buys the
# full matrix for one tree. Why it is cut there, and what stands in between a merge and the next nightly, is in
# `docs/developing.md`.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 03:17 UTC, off the round hour so a queue backlog at :00 is not this repository's problem too.
    - cron: '17 3 * * *'
  workflow_dispatch:

# Nothing here writes back to the repository, so the token stays read-only.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # **The hermeticity lock.** A missing model artifact makes `np embed` dial out by default — which is what
  # the product needs and what a test run must never do. Every test harness already strips this variable so its own cases
  # decide, and this is the lock for everything else that runs a binary here (smoke checks, packaging, a future step nobody
  # has written yet). It costs nothing and it means "the CI runner phoned home" cannot be discovered in a bill.
  NP_NO_AUTO_FETCH: "1"

jobs:
  # Which OS rows this event pays for. A job-level `if` cannot see `matrix`, so the choice is made once here and the
  # test job matrices over it — one set of steps for both platforms rather than two near-identical jobs that drift
  # apart (the same complaint, applied to YAML). Windows is dropped only for `push`; schedule, dispatch and pull
  # requests all pay for it.
  prepare:
    name: Decide the matrix
    runs-on: ubuntu-latest
    outputs:
      oses: ${{ steps.pick.outputs.oses }}
    steps:
      - name: Pick
        id: pick
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            echo 'oses=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
            echo "push event: ubuntu only — Windows and both C++ rows wait for the nightly or a dispatch"
          else
            echo 'oses=["ubuntu-latest","windows-latest"]' >> "$GITHUB_OUTPUT"
            echo "${{ github.event_name }} event: full matrix"
          fi

  # One job, one or both platforms: the OS entries are the rows on the run page.
  test:
    name: Test (${{ matrix.os }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.prepare.outputs.oses) }}
    steps:
      - uses: actions/checkout@v4
      # A `run:` block with its quotes nested wrong is not a YAML error (the file loads) and not a Rust error (no gate sees it),
      - name: Workflow shell steps parse
        if: runner.os == 'Linux'
        run: .github/scripts/check-workflow-shells.sh
      - name: Toolchain components
        run: rustup component add clippy rustfmt
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      # `cargo doc` has no `--deny` flag of its own, so the lint setting goes through rustdoc.
      # The whole workspace, because `np-cli` documents clean too — a warning in its docs would
      # otherwise reach main unnoticed.
      - name: Docs
        env:
          RUSTDOCFLAGS: --deny warnings
        run: cargo doc --locked --workspace --no-deps
      # `CMAKE` points at nothing on purpose. Both runners have cmake preinstalled, so "the default build never
      # touches the C++" would otherwise be unprovable here: a regression that probed cmake with the feature off
      # would stay green and just get slower. With this set, build.rs meeting cmake at all is impossible - it
      # returns before reading the variable, and if that ever stops being true this row fails.
      - name: Test
        env:
          CMAKE: /nonexistent
        run: cargo test --locked --workspace
      # The release-only cases (`#[ignore]`d huge-input tests) run here, so a linear-time
      # regression in `items` or `links` cannot land unmeasured.
      - name: Release tests
        run: cargo test --locked --release -- --ignored

  # The `local-model` row that `docs/design-m2-local-embeddings.md` promised, now that there is something
  # behind the feature to rot. A feature nothing compiles is invisible in exactly three ways - clippy
  # lints inside `cfg(feature)`, rustdoc warnings in gated docs, and tests whose early return looks like
  # a pass - and this job is what makes each of those fail loudly instead.
  #
  # Linux only, on purpose. The C++ build was measured here (23 s for target `llama`) and has seen
  # nothing on Windows or macOS, so adding those rows would put a claim in YAML that nobody has watched
  # happen - the same mistake, made with a different noun. The Windows feature row lands when someone has seen it
  # green, and release policy keeps binaries on the feature off until then.
  #
  # Honest about what this row proves. It *has* run on hosted runners — which is worth writing down because the opposite was
  # believed here for days, and reading the runs beat assuming the silence — and a Windows-only lint or a platform-specific
  # answer is visible only here. Local gates stay the primary evidence, not the only evidence.
  #
  # Gated to schedule, dispatch and pull requests because it rebuilds the vendored C++ on every run. What that costs, and how
  # the matrix is cut against a finite hosted-minute budget, is `docs/developing.md`'s business; keeping arithmetic out of
  # this file means a change in price cannot make these comments lie. The same checks run locally before every merge
  # (`clippy-localmodel`, `rustdoc-deny-localmodel` and the feature-test rows), so what CI adds is an independent machine,
  # not a first sighting.
  feature-local-model:
    name: Feature local-model (ubuntu-latest)
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain components
        run: rustup component add clippy rustfmt
      # The one network step in this repository's build. Keyed on the pin file (where both digests live) *and*
      # on the script that produces the directory: an unpack layout change - strip-components, stamp location -
      # has to invalidate the cache too, or CI keeps restoring the old-shaped tree while the new script refuses
      # to re-unpack over it. The script is idempotent and verifies content by header digest,
      # so a cache miss costs one 38.7 MB download rather than a stale-tree surprise.
      - name: Cache the pinned llama.cpp source
        uses: actions/cache@v4
        with:
          path: .vendor
          key: llama-cpp-${{ hashFiles('third_party/llama-cpp.toml', 'scripts/vendor-llama-cpp.sh') }}
      - name: Vendor llama.cpp
        run: ./scripts/vendor-llama-cpp.sh
      # cmake is preinstalled on ubuntu-latest; `build.rs` honours a `CMAKE` override for hosts where it
      # is not, and refuses with that name if it cannot find one at all.
      - name: Check
        run: cargo check --locked -p np-core --features local-model
      - name: Clippy
        run: cargo clippy --locked -p np-core --features local-model --all-targets -- -D warnings
      # The third way a feature is invisible, and the reason this step exists: `llama_ffi` is gated in
      # `src/lib.rs`, so the default job's Docs step never compiles the module and none of its intra-doc links
      # are resolved by any run. The job comment names rustdoc as one of the three gaps it closes, so it has
      # to run here. It passes today, so this is coverage
      # being closed rather than a warning being unhidden.
      - name: Docs (feature on)
        env:
          RUSTDOCFLAGS: "--deny warnings"
        run: cargo doc --locked -p np-core --features local-model --no-deps
      # **The pair `np serve`'s wire tests are gated on.**
      # `crates/np-cli/tests/serve.rs` gates its fetch- and chunk-narration cases on `all(feature = "local-model",
      # feature = "fetch")`, because a default build has no transport to narrate and no runtime to embed with — and no
      # other job built that pair for np-cli: the vision job uses `vision`, and the default job's features exclude
      # `local-model`. So in every hosted log those cases compiled as their own `NOT COVERAGE` stub, which is how a
      # feature can be green and unread at the same time.
      #
      # What this step covers on a runner with no artifact: the framing of every line, that opt-in is total, the throttle's
      # per-request reset, `shutdown` ending the session, contention and offline arriving as results rather than faults, and
      # that `status.get` creates no database. What it cannot cover without `NP_TEST_MODEL_PATH`: byte checkpoints against a
      # real origin and the `embedding`/`writing` lines — those print `NOT COVERAGE` here and run for real on the local
      # `test-cli-lm-fetch` row in `.github/scripts/gates.sh`, which is the row that carries weights.
      - name: Test `np serve` over a pipe (local-model + fetch)
        run: cargo test --locked -p np-cli --features local-model,fetch --test serve -- --nocapture


      # with the feature on, and a wrong field order is an unsound memory bug rather than a compile
      # error. The reporting rule wants skipped work printed as `NOT COVERAGE`. `local_runtime.rs` cannot skip at all -
      # no artifact gate, no env-var escape - so a green run there means llama.cpp was called.
      #
      # `--test local_load` is here so the loader compiles and runs on this row. What it does NOT prove on a
      # runner: there is no 310 MB artifact, so **four** of its seven cases print `NOT COVERAGE` and pass - the
      # real-file facts (768/512/262144/MEAN), the declared-vs-actual width refusal, the three-round load/drop
      # cycle, and the truncated-artifact refusal. Those are measured locally with `NP_TEST_MODEL_PATH` set.
      # What this row does cover without a model file: the two pre-runtime refusals (absent path, directory),
      # the runtime's own bad-magic refusal (bytes reach `llama_model_load_from_file` and come back null), and
      # the module's synthetic unit tests for pooling/positive-count refusals. Say it that plainly because
      # "every refusal" was false: every `Unavailable` arm and the width refusal need an artifact.
      #
      # `--test local_embed` is the forward pass, and on GitHub it is **compilation plus thirteen printed
      # `NOT COVERAGE` lines and nothing else** - every case there asks a model for a vector (four of
      # local_load's seven, the same way). What runs locally
      # with the artifact (and is the actual deliverable) is the unit-length and determinism checks, the cosine
      # ordering, the token-budget and window refusals, the 600-token no-abort regression, and the throughput
      # figures. Listing it here still earns its place: a test file that does not compile against the pinned
      # header is caught on the row, which is where a re-pin first shows up.
      - name: Link proof
        # `--nocapture` is load-bearing, not cosmetics. libtest captures a passing test's stdout
        # under the command of that day with no artifact the count was **0**, and 12 only with the flag - the same
        # The count is then
        # echoed so "compiled, never ran" is written on the record rather than implied - and the test exit
        # code, not the grep, is what fails the job.
        run: |
          # `set +e` first, deliberately: the runner starts these blocks with errexit on, and under errexit a failing
          # `cargo test` aborts the shell at that pipeline - which is exactly when the count matters most (A2 review
          # P2-3). Capture the status, print the record, then exit with cargo's code so the test result stays what
          # fails the job.
          set +e
          set -uo pipefail
          cargo test --locked -p np-core --features local-model --lib --test local_runtime \
            --test local_load --test local_embed --test local_window --test artifact_verify \
            --test local_corpus --test local_threads --test local_vision -- --nocapture 2>&1 \
            | tee /tmp/feature-tests.log
          status=${PIPESTATUS[0]}
          count=$(grep -c 'NOT COVERAGE' /tmp/feature-tests.log)
          echo "NOT COVERAGE occurrences: $count"
          if [ "$status" -ne 0 ]; then
            echo "the feature test row failed (exit $status); the count above is context, not the verdict" >&2
            exit "$status"
          fi
          # With no artifact configured the floor below counts 29 lines: thirteen in `local_embed`, four of seven in
          # `local_load`, three in `local_window`, four in `local_corpus`, plus the remainder from other cases in the same binaries — this comment lists what is
          # known per file, and does not pretend to have re-derived the total.
          # Two files print none on purpose. `local_runtime` cannot skip - it is the row that proves the seam refuses
          # without a runtime - and `artifact_verify`'s cases hash a few hundred fixture bytes rather than the pinned
          # artifact, so they run for real here; they are on this row because the function under test lives behind
          # `local-model`. `local_corpus` is the case this floor exists to keep honest: three of its four need weights and
          # ten minutes of CPU a runner does not have, and the fourth (`auto`, ~181 s at twelve workers locally) must say
          # out loud that it did not run.
          # `local_threads` (D13) adds four - **two cases, two lines each**, because a gated case prints what it could
          # not measure and then prints how to measure it. On a runner this row is compilation plus four printed skips:
          # the sweep cell needs both the artifact and `$NP_THREAD_*`, and the worker-count readback needs the runtime.
          # `local_vision` adds **one** line to this row, not ten. The row builds `--features local-model`, so
          # the file's ten projector cases are not even compiled (`#[cfg(not(feature = "vision"))]` replaces them) and
          # what prints is the feature-off statement `vision_feature_is_off`: no projector was opened, re-run with
          # `--features local-model,vision`. That is the whole of what this row says about images - that a file gated
          # on a feature it does not have still compiles and still refuses to claim anything.
          #
          # What the row does NOT prove about vision, stated because "local_vision is on the link-proof row" reads like
          # image coverage and is not any. With the pair on and no artifact the same command prints 38 lines: +9 net over
          # the 29 above, not +10, because enabling `vision` retires the feature-off statement as its ten gated cases
          # arrive. The ten are one per case that needs both files
          # (`an_image_embeds_to_768_components_of_unit_length`, `the_same_bytes_twice_give_bit_identical_components`,
          # `text_still_matches_what_it_was_after_an_image_ran`, `the_provider_seam_and_the_facade_agree_bit_for_bit`,
          # `a_truncated_png_refuses_rather_than_returning_a_vector`,
          # `audio_bytes_refuse_because_this_seam_only_makes_image_vectors`,
          # `a_projector_refuses_a_model_it_was_not_opened_against`, `token_cost_is_measured_per_encode_and_printed`,
          # `a_caption_beats_an_unrelated_image`, `a_large_image_either_embeds_within_the_window_or_refuses_over_budget`).
          # A runner has no 554 MB projector either, so adding the feature to this row would buy ten more printed
          # skips and no measured pixel. Nine of the ten run only where both env vars point at real files; the tenth,
          # `a_large_image_either_embeds_within_the_window_or_refuses_over_budget`, has a second gate of its own
          # (`$NP_TEST_VISION_LARGE`, an oversized PNG) and prints its own `NOT COVERAGE` without it - the same two-key shape
          # this block documents for `local_threads`' `$NP_THREAD_*` cell above.
          # `refusal_classes_are_the_report_labels_verbatim` is the file's one artifact-free case - it prints `CLASSES:`,
          # not `NOT COVERAGE`, so neither count includes it.
          #
          # it: **29**, twice (28 before the file was added). A smaller total means the
          # prints stopped reaching the log - `--nocapture` lost, or a case silently became a real pass with no
          # artifact - and "compiled, never ran" would be implied rather than stated again.
          if [ "$count" -lt 29 ]; then
            echo "expected at least 29 NOT COVERAGE lines with no artifact, saw $count: §2 step 4 is not on the record" >&2
            exit 1
          fi
      # "A green run means llama.cpp was called" is only worth saying if the run can also say *which* llama.cpp.
      # `-l static=llama` is not an exclusive search path, so two cheap probes back it up: no shared llama in the
      # test binary, and `llama_version` defined in it. Read what the two do and do not say: together
      # they show **static linkage from an archive this run produced**. A runner that happened to have llama.cpp
      # installed statically would satisfy both just the same - every post-v0.8.0 revision reports `0.8.0-dev` as well
      # (`LLAMA_BUILD_IS_DEV=ON`) - so the pinned header digest enforced in build.rs is what identifies the tree, and
      # this step proves only which linkage we got.
      - name: Link identity probes
        run: |
          set -euo pipefail
          bin=$(cargo test --locked -p np-core --features local-model --test local_runtime --no-run --message-format=json \
            | sed -n 's/.*"executable":"\([^"]*local_runtime[^"]*\)".*/\1/p' | tail -n 1)
          test -n "$bin" && test -x "$bin"
          echo "inspecting $bin"
          if ldd "$bin" | grep -i llama; then
            echo "FAIL: a shared llama.cpp was picked up off the loader path" >&2
            exit 1
          fi
          echo "ok: no shared llama dependency"
          if ! nm --defined-only "$bin" | grep -q ' T llama_version'; then
            echo "FAIL: llama_version is not defined in the test binary; it did not come from our archive" >&2
            exit 1
          fi
          echo "ok: llama_version defined locally (static linkage from an archive this build produced)"

  # **The gap this closes.** Every `--features local-model,vision` row this repository ever ran was graded on `-p np-core`,
  # while the crate a user actually builds — np-cli — did not declare the feature at all. That pair therefore failed at
  # *feature resolution* ("the package 'np-cli' does not contain this feature: vision", exit 101), which is a different
  # failure from a compile error and one no np-core row can produce. A green row proving a library builds some way says
  # nothing about whether the binary can be built that way; this job is the difference between those two claims, and it is
  # why the card could stay open while CI was green for five days.
  # Same gating as the row above: it is a C++ build too, and this is the row that proves `np` itself compiles with the
  # pair rather than only np-core.
  feature-vision:
    name: Feature local-model,vision (ubuntu-latest)
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain components
        run: rustup component add clippy rustfmt
      # Same cache key as the row above — one tree, two feature sets. Keyed on the pin file *and* the unpack script, because
      # a layout change (strip-components, where the stamp lands) has to invalidate the cache too, or CI keeps restoring the
      # old-shaped tree while the new script refuses to re-unpack over it.
      - name: Cache the pinned llama.cpp source
        uses: actions/cache@v4
        with:
          path: .vendor
          key: llama-cpp-${{ hashFiles('third_party/llama-cpp.toml', 'scripts/vendor-llama-cpp.sh') }}
      - name: Vendor llama.cpp
        run: ./scripts/vendor-llama-cpp.sh
      # The mechanical half of that gap as a gate: `np` itself, built with the pair. This is the step that would have failed
      # while the gap was open, and it costs one `cargo check`.
      - name: Check the CLI with the pair
        run: cargo check --locked -p np-cli --features local-model,vision
      - name: Clippy (np-core and np-cli, pair on)
        run: cargo clippy --locked -p np-core -p np-cli --features local-model,vision --all-targets -- -D warnings
      # Rustdoc is the second invisible way a feature goes ungraded, and it bites in both directions across this workspace:
      # a doc link to `crate::local_model::…` resolves on no default build, while a bare `[ImageBlocker]` link resolves *only*
      # here and breaks the other two. The asymmetry is real and reproducible: default passes, this row fails.
      - name: Docs (pair on)
        env:
          RUSTDOCFLAGS: "--deny warnings"
        run: cargo doc --locked -p np-core -p np-cli --features local-model,vision --no-deps
      # What this row covers with no 554 MB projector on a runner, and what it cannot. It runs for real: which bytes may be
      # handed to `with_mmproj` (an unrecorded file stays a file; a recorded one is hashed once and stamped; a same-size swap
      # behind a live stamp is trusted — the documented shortcut, asserted rather than assumed; a moved digest refuses), the
      # capability-versus-projector blocker distinction, and §8's class-constant agreement. It does **not** encode an image:
      # every projector-backed case in this file prints `NOT COVERAGE` without both artifacts, which is the difference between
      # "compiled" and "ran" that F18's rule exists to keep loud.
      - name: Test (pair on, artifacts absent ⇒ printed NOT COVERAGE)
        run: cargo test --locked -p np-core --features local-model,vision --test local_vision -- --nocapture

  # **AddressSanitizer over the FFI boundary, nightly and on demand.** Not per pull request: it rebuilds std and the pinned
  # C++ with sanitizer flags, which is minutes a merge should not wait on. It exists because nearly every `unsafe` site in
  # this tree calls into llama.cpp — the lints (`#![deny(unsafe_op_in_unsafe_fn, clippy::undocumented_unsafe_blocks)]` in both
  # crates) keep each block argued in writing; only a sanitizer can catch the class of mistake where the argument was wrong.
  # The script is the gate: it builds a private copy of the pinned source so cmake cannot hand back an unsanitized cache, and
  # prints `NOT COVERAGE` rather than a pass if the archives carry no ASan symbols. Findings get filed as cards, not silenced.
  asan-local-model-vision:
    name: AddressSanitizer local-model,vision (nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Nightly toolchain, rust-src, and cmake
        run: |
          rustup toolchain install nightly --component rust-src
          sudo apt-get update
          sudo apt-get install -y cmake
      - name: Cache the pinned llama.cpp source
        uses: actions/cache@v4
        with:
          path: .vendor
          key: llama-cpp-${{ hashFiles('third_party/llama-cpp.toml', 'scripts/vendor-llama-cpp.sh') }}
      - name: Vendor llama.cpp
        run: ./scripts/vendor-llama-cpp.sh
      - name: Build with ASan, prove the archives are instrumented, run the loader and decoder tests
        run: ./.github/scripts/asan-localmodel.sh
