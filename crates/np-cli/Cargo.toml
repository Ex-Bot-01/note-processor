[package]
name = "np-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "note-processor command line interface"

[[bin]]
name = "np"
path = "src/main.rs"

[features]
# `local-model` belongs to np-core, which owns the FFI and the C++ build. This passthrough exists so the artifact-size
# promise is measured on `np` itself — the binary a user downloads, clap included — rather than on a synthetic example.
# Default **off**: the shipped binary links no C++. That does not mean `np embed` disappears; it means who answers the
# batch changes. Off, `LocalModelProvider::embed` returns `RuntimeNotBuilt` and the report says nothing was produced. The
# default CI row has to keep proving exactly that: a default build that wrote a vector would mean the flag stopped meaning
# anything.
local-model = ["np-core/local-model"]
# The `vision` passthrough. Without it `cargo build --features local-model,vision -p np-cli` fails at *feature resolution*
# ("the package 'np-cli' does not contain this feature: vision"), so no CLI build — and no gate built on one — could ever
# have encoded a figure: a green `--features local-model,vision` row would have been grading np-core alone. Default **off**,
# for the same reasons as `local-model`, including the promise that a build which cannot load the projector never plans its
# 554,821,056 bytes. On, `np embed` hands a digest-matching projector to the runtime and figures encode. CI builds it
# (`feature-vision`), because a feature nothing compiles is invisible in exactly this way.
vision = ["np-core/vision"]
# Fetch is default-**on** here, mirroring np-core (`docs/adr/0003-local-embeddinggemma-at-768.md`: the artifact is fetched
# on first use). Opting out is visible in argv — `--no-default-features` leaves `np models fetch` out of the subcommand
# table entirely, so a build cannot advertise a command it cannot run. Cost: an HTTP+TLS client in the shipped binary.
default = ["fetch"]
fetch = ["np-core/fetch"]

[dependencies]
clap = { workspace = true }
# `default-features = false` is load-bearing, not tidiness: np-core defaults `fetch` on, so without this line a
# `np --no-default-features` build still linked ureq/rustls **and** emitted advice naming `np models fetch` — a subcommand
# this binary had compiled out of its own help screen. One knob decides both halves: np-cli's `fetch`.
np-core = { path = "../np-core", default-features = false }
serde_json = { workspace = true }
# Diagnostics (`src/diag.rs`). `tracing` because the CLI emits on the same channel np-core does — a refusal decided in
# argument handling has to be reportable the same way as one decided in the database; `tracing-subscriber` because **this
# crate is the only one that owns a process**, so it is the only one allowed to install a global sink.
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# A diagnostic must never be the reason a command waits. On unix the stderr sink asks `poll` whether descriptor 2 will take
# a write *now* and drops the line when it will not: one syscall, no thread, and no change to the descriptor's flags —
# setting `O_NONBLOCK` on fd 2 would make every other stderr writer in the process, including the pinned user-facing
# sentences, lose its line to `EAGAIN`. Windows has no `poll`, so there the write stays blocking; `[log] file` is the answer
# for a client that never reads stderr.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The unread-stderr case builds its own pipe so it can make it **small** (`pipe_small` in `tests/diag.rs`): a 4 KiB pipe
# fills after a handful of diagnostics, which is how you prove the closing notice at exit does not wait for a reader.
# `F_SETPIPE_SZ` is unix-only, so only unix gets the dependency and the case is `cfg(unix)`.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[dev-dependencies]
# Test-only: `tests/cli.rs` seeds a version-two workspace database by hand, because no production API writes an old schema
# and without that fixture the upgrade path from it is unreachable — and therefore untested.
rusqlite = { workspace = true }
tempfile = { workspace = true }
