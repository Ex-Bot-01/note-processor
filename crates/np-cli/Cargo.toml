[package]
name = "np-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "note-processor command line interface"

[[bin]]
name = "np"
path = "src/main.rs"

[features]
# `local-model` belongs to np-core, the crate that owns the FFI and the C++ build. This passthrough exists for
# one reason: §14's "the binary must stay under ~40 MB" is a claim about the artifact a user downloads, so it
# has to be measured on `np` itself rather than on a synthetic example that leaves clap out. Default **off** —
# the shipped binary links no C++ (§9) — and note what that does *not* mean. `np embed` reaches `local_model` in
# either build; what changes is who answers the batch. With this feature the provider loads the artifact on the
# first batch and computes vectors; without it `LocalModelProvider::embed` answers `RuntimeNotBuilt` and §6's arm
# (iv) reports that nothing was produced. The default CI row must keep proving exactly that — a default build that
# wrote a vector would mean the flag stopped meaning anything.
local-model = ["np-core/local-model"]
# **F28: the passthrough this crate was missing.** Without it `cargo build --features local-model,vision -p np-cli` fails at *feature resolution*
# — "the package 'np-cli' does not contain this feature: vision" — so no CLI build, and no gate built on one, could ever have embedded a figure;
# every green `--features local-model,vision` row in CI was grading np-core alone. Default **off**, for the same two reasons `local-model` is off:
# §9's "the shipped binary links no C++", and §13's promise that a build which cannot load the projector never plans its 554,821,056 bytes.
# What turns it on buys one behaviour: `np embed` hands a recorded, digest-matching projector to the runtime, so figures encode instead of
# refusing as `projector-absent`. It changes no default artifact's size, and CI builds it (`feature-vision`) because "a feature nothing compiles"
# is precisely how this card stayed open.
vision = ["np-core/vision"]
# The fetch path is default-**on** here, mirroring `np-core`'s own default (§12's premises: a fetch command release
# builds compile out would defeat the human's amendment of 2026-10-29). Opting out is explicit and visible in argv:
# `--no-default-features` leaves `np models fetch` out of the subcommand table entirely, so a build cannot advertise a
# command it cannot run. The cost is the same one §12 accepts — an HTTP+TLS client in the shipped binary.
default = ["fetch"]
fetch = ["np-core/fetch"]

[dependencies]
clap = { workspace = true }
# `default-features = false` is load-bearing, not tidiness. np-core's own default turns `fetch` on, so without this line a
# `np --no-default-features` build still linked ureq/rustls **and** — the part that produced a wrong message — let np-core's
# arm-(iii) remedy name `np models fetch`, a subcommand this binary had compiled out of its help screen. One knob across the
# workspace: np-cli's `fetch` is the only thing that decides whether the command exists and whether the advice may name it.
np-core = { path = "../np-core", default-features = false }
serde_json = { workspace = true }

[dev-dependencies]
# Only for `tests/cli.rs`, which has to seed a version-two workspace database by hand: no production API
# writes an old schema, and the version-2 fixture is what makes F21's upgrade path reachable at all.
rusqlite = { workspace = true }
tempfile = { workspace = true }
