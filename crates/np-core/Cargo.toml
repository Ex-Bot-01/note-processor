[package]
name = "np-core"
version.workspace = true
edition.workspace = true
license.workspace = true

# `local-model` gates the local inference runtime: `docs/design-m2-local-embeddings.md`. No dependency crate is
# declared — the FFI in `src/llama_ffi.rs` is written by hand against the pinned revision (`third_party/llama-cpp.toml`)
# precisely to keep bindgen and its build-dependencies out. Cost with the feature off: nothing. With it on: a cmake + C++
# toolchain and a tree fetched by `scripts/vendor-llama-cpp.sh`, which the default build must never need — proven by the
# default gate list running on a machine with no cmake.
#
# `embed::LocalModelProvider` compiles in the default build on purpose, so callers and CI exercise the seam without paying
# for inference. The fence that matters is `cargo check --locked -p np-core --features local-model`, run on Linux until a
# green build is recorded on another OS; release builds keep it off until Windows has one.
# `vision` implies `local-model`: `docs/design-m2-image-embeddings.md`. It costs one cmake option (`LLAMA_BUILD_MTMD=ON`,
# off in the pinned tree), one extra target, and **two** extra archives — `libmtmd.a` needs `hash_sha256_hex` from
# `libvendor-hash.a`, so a vision link measures six archives rather than five — plus the 554 MB projector artifact. No
# default-off feature changes a shipped binary's size or dependencies; no size number is claimed here.
[features]
# **`fetch` is default-ON, unlike `local-model`**: a fetch path that release builds compiled out would defeat the ruling
# that made downloading part of the product (`docs/adr/0003-local-embeddinggemma-at-768.md`), so opting out is explicit
# `--no-default-features`. Cost, paid in all three release binaries: an HTTP+TLS client.
default = ["fetch"]
local-model = []
# Image embedding through llama.cpp's `mtmd`. The implication says there is no vision code in a build with no runtime to
# attach it to; saying so is not enforcing it, and nothing here pretends otherwise.
vision = ["local-model"]
fetch = ["dep:ureq"]

[dependencies]
regex = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
# Instrumentation only: np-core emits spans and events and never installs a subscriber, so a build that asks for nothing pays a
# level check (`docs/superpowers/specs/2026-11-09-np-diagnostics-design.md` "free when off").
tracing = { workspace = true }
toml = { workspace = true }
unicode-width = { workspace = true }
# The only network client in the workspace, and it is reachable from one module (`fetch::http`). `scan` has no
# path to it, which `tests/embed.rs`'s zero-sized-provider fence and the CLI's command table both keep true.
ureq = { version = "2", optional = true, default-features = false, features = ["tls"] }
walkdir = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# Only tests need this one: `embed_run`'s report is a *contract*, and a contract about key spellings can only be pinned by
# serialising it. The library itself never builds JSON — np-cli does that (`crates/np-cli/Cargo.toml`), which is why this is
# a dev-dependency and not a dependency.
serde_json = { workspace = true }

# `fetch`'s disk preflight asks the filesystem how much room it has. Only unix exposes `statvfs`, so only unix gets this
# dependency: Windows answers from `GetDiskFreeSpaceExW` with no dependency at all (`src/fetch.rs`), and a target that is
# neither answers None, which the report prints as free space not checked (F18).
[target.'cfg(unix)'.dependencies]
libc = "0.2"
