[package]
name = "np-core"
version.workspace = true
edition.workspace = true

# `local-model` is the gate the local inference runtime lives behind
# (`docs/design-m2-local-embeddings.md` §2, §6, §14). It still declares no dependency crate — §14 chose
# hand-written FFI over the pinned Rust binding precisely to avoid bindgen and its build-dependencies.
# What it now gates is real: `build.rs` compiles the pinned llama.cpp (`third_party/llama-cpp.toml`) and
# `src/llama_ffi.rs` mirrors that revision's C API. So the honest statement of the cost has changed:
# with the feature off, nothing; with it on, a cmake + C++ toolchain and a source tree that
# `scripts/vendor-llama-cpp.sh` fetched — neither of which the default build may ever need (§2's promise,
# proven by the default gate list running with no cmake on PATH).
#
# The seam itself — `embed::LocalModelProvider` — still compiles in the default build on purpose, so
# callers and CI exercise the API without paying for inference (§9 item 1).
#
# `cargo check --locked -p np-core --features local-model` is the fence that matters now, and it runs on
# the Linux row only until someone has watched it go green elsewhere (§14's per-OS honesty). Release
# builds keep the feature off until a Windows build of it is recorded in CI once (§2).
# `vision` (R7c) sits on top of `local-model` and implies it: `docs/design-m2-image-embeddings.md` §10. What turning it
# on costs is one cmake option (`LLAMA_BUILD_MTMD=ON`, which the pinned tree defaults to off), one extra cmake target
# (`mtmd`), **two** extra archives on the link line — `libmtmd.a` needs `hash_sha256_hex`, which lives in
# `libvendor-hash.a`, so a vision link measures six archives rather than five
# (`crates/np-core/tests/probes/vision-spike-2026-11-02.md`) — and the 554 MB projector artifact. Default-off like
# `local-model`, so no shipped shape changes size or dependencies; the package-size re-measurement for this row is
# R7c Task 7's work, not a number claimed here.
[features]
# **`fetch` is default-ON, unlike `local-model`** (`docs/design-m2-local-embeddings.md` §12's premises): a fetch path
# that release builds compile out would defeat the human's amendment of 2026-10-29, so opting out has to be an explicit
# `--no-default-features`. The cost is stated where it is paid — an HTTP+TLS client in three release OSes' binaries.
default = ["fetch"]
local-model = []
# Image embedding through llama.cpp's `mtmd`. There is no vision code in a build that has no runtime to attach it to,
# which is what the implication states rather than what it enforces.
vision = ["local-model"]
fetch = ["dep:ureq"]

[dependencies]
regex = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
unicode-width = { workspace = true }
# The only network client in the workspace, and it is reachable from one module (`fetch::http`). `scan` has no
# path to it, which `tests/embed.rs`'s zero-sized-provider fence and the CLI's command table both keep true.
ureq = { version = "2", optional = true, default-features = false, features = ["tls"] }
walkdir = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# Only tests need this one: `embed_run`'s report is a *contract*, and a contract about key spellings can only be pinned by
# serialising it. The library itself never builds JSON — np-cli does that (`crates/np-cli/Cargo.toml`), which is why this is
# a dev-dependency and not a dependency.
serde_json = { workspace = true }

# `fetch`'s disk preflight asks the filesystem how much room it has. Only unix exposes `statvfs`, so only unix gets this
# dependency: Windows answers from `GetDiskFreeSpaceExW` with no dependency at all (`src/fetch.rs`), and a target that is
# neither answers None, which the report prints as free space not checked (F18).
[target.'cfg(unix)'.dependencies]
libc = "0.2"
